# =========================================================
# Configuración usada SOLO al ejecutar pruebas (mvn test)
# Sobrescribe a src/main/resources/application.properties
# =========================================================

server.port=0

# Base de datos H2 en memoria, una instancia limpia por cada ejecución de tests
spring.datasource.url=jdbc:h2:mem:reclamos_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

logging.level.org.hibernate.orm.results=warn
logging.level.org.hibernate.resource.transaction=warn
logging.level.org.springframework.web=warn

# Configuración de correo ficticia: nunca se conecta de verdad en los tests,
# EmailService atrapa cualquier excepción de conexiÃ³n de forma silenciosa.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000
