<!-- Barra Superior Nav -->
<nav class="navbar navbar-expand-lg border-bottom" style="background-color: #7bb32e">
  <div class="container-fluid px-4 py-1">
    <div class="d-flex align-items-center">
      <span class="bg-white text-success fw-bold px-2 py-1 rounded me-2">TOTTUS</span>
      <span class="text-white fw-bold me-2">Portal de Clientes</span>
      <a href="javascript:void(0)" class="text-white text-decoration-none ms-2" (click)="salir()"
        >> Salir</a
      >
    </div>
    <div class="d-flex align-items-center">
      <a
        href="javascript:void(0)"
        class="text-white text-decoration-none me-4 small fw-bold"
        (click)="nuevoReclamo()"
        >Nuevo Reclamo</a
      >
      <a
        href="javascript:void(0)"
        class="text-white text-decoration-none me-4 small fw-bold text-decoration-underline"
        >&#128193; Mis Casos</a
      >
    </div>
  </div>
</nav>

<div class="container py-5 d-flex justify-content-center bg-light" style="min-height: 90vh">
  <div class="card shadow-sm border-0" style="width: 100%; max-width: 900px; height: fit-content">
    <div class="card-body p-5">
      <!-- Cabecera de la tabla -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold m-0 d-flex align-items-center text-dark">
          <span class="text-success me-2 fs-3">&#128193;</span> Mis Reclamos
        </h4>
        <a
          href="javascript:void(0)"
          class="text-success fw-bold text-decoration-none"
          (click)="nuevoReclamo()"
        >
          Nuevo Reclamo +
        </a>
      </div>

      <!-- Tabla de Casos -->
      <div class="table-responsive">
        <table
          class="table table-borderless align-middle"
          style="border-collapse: separate; border-spacing: 0 10px"
        >
          <thead>
            <tr class="text-muted small border-bottom">
              <th class="fw-bold pb-3">Código</th>
              <th class="fw-bold pb-3">Fecha</th>
              <th class="fw-bold pb-3">Motivo</th>
              <th class="fw-bold pb-3">Estado</th>
              <th class="fw-bold pb-3 text-center">Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let caso of reclamos" class="bg-white border-bottom">
              <td class="fw-bold text-dark py-3">{{ caso.codigo }}</td>
              <td class="text-secondary small">{{ caso.fecha }}</td>
              <td class="text-secondary small">{{ caso.motivo }}</td>
              <td>
                <span
                  class="badge rounded-pill fw-bold px-3 py-2 border d-inline-flex align-items-center"
                  [ngClass]="{
                    'bg-light text-secondary border-secondary': caso.estado === 'Ingresado',
                    'bg-warning text-dark border-warning': caso.estado === 'En Proceso',
                    'bg-danger text-white border-danger': caso.estado === 'Vencido',
                    'bg-white text-success border-success': caso.estado === 'Resuelto',
                    'bg-white text-primary border-primary': caso.estado === 'En Análisis',
                  }"
                  [style.background-color]="caso.estado === 'En Proceso' ? '#fcf0cc' : ''"
                >
                  {{ caso.estado }}
                </span>
              </td>
              <td class="text-center">
                <button
                  class="btn btn-sm btn-outline-success rounded-pill px-3 fw-bold"
                  (click)="verDetalle(caso.codigo)"
                >
                  Ver
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Mensaje si no hay reclamos -->
      <div *ngIf="reclamos.length === 0" class="text-center py-4">
        <p class="text-muted small mb-0">No se encontraron reclamos en el historial.</p>
      </div>
    </div>
  </div>
</div>

<button
  class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4 shadow d-flex justify-content-center align-items-center"
  style="width: 50px; height: 50px; z-index: 1000"
>
  <i class="fs-4 text-white">&#9855;</i>
</button>
