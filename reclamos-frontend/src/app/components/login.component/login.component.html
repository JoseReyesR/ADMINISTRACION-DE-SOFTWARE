<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow border-0 rounded-3">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h4 class="fw-bold text-primary">BackOffice Tottus</h4>
          <p class="text-muted small">Módulo de Gestión de Reclamos</p>
        </div>

        <!-- Alerta de error -->
        <div *ngIf="mensajeError" class="alert alert-danger text-center small py-2">
          {{ mensajeError }}
        </div>

        <!-- Formulario Template Driven -->
        <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
          <div class="mb-3">
            <label class="form-label fw-bold small">Correo Electrónico</label>
            <input
              type="email"
              class="form-control bg-light"
              name="correo"
              [(ngModel)]="credenciales.correo"
              required
              placeholder="ejemplo@tottus.com"
            />
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold small">Contraseña</label>
            <input
              type="password"
              class="form-control bg-light"
              name="password"
              [(ngModel)]="credenciales.password"
              required
              placeholder="••••••••"
            />
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold" [disabled]="!loginForm.valid">
            Ingresar al Sistema
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
